name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest --cov=rfideye --cov-report=term-missing

  read-only-guarantee:
    name: Read-only guarantee
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # The project's central claim gets its own required job so a broken
      # guard can never be merged, even if someone skips the matrix.
      - name: Guard tests must pass
        run: pytest tests/test_read_only_guard.py -v
      - name: No write/clone/emulate verb may appear in the allow-list
        run: |
          python - <<'PY'
          from rfideye import read_only_guard as guard
          banned = {"wrbl", "wrsc", "write", "clone", "restore", "sim",
                    "eload", "esave", "nested", "darkside", "autopwn"}
          for rule in guard.ALLOWED_RULES:
              overlap = banned.intersection(rule.prefix)
              assert not overlap, f"{rule.name} contains {overlap}"
          print(f"OK: {len(guard.ALLOWED_RULES)} allow-list rules, all read-only")
          PY
